name: Matched detection report
on:
  push:
    branches: [matched-detection-stats-02]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'mohanad-hafez/gh-aw-threat-detection-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        arm: [agent, script]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: matrix.arm == 'script'
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Copilot
        if: matrix.arm == 'agent'
        run: npm install --global @github/copilot@1.0.108
      - name: Prepare the report and history
        env:
          ARM: ${{ matrix.arm }}
          GITHUB_TOKEN: ${{ matrix.arm == 'agent' && github.token || '' }}
        run: |
          mkdir evidence
          if [ "$ARM" = script ]; then
            go run ./cmd/matched-stats > evidence/go-result.json
          else
            node -e 'const c=process.cwd(),m=c+"/.github/matched";console.log(JSON.stringify({mcpServers:{fixture:{type:"local",command:"node",args:[m+"/component_fixture.cjs",m+"/stats-fixture.json",c+"/evidence/tools.jsonl"],tools:["*"]}}}))' > fixture-mcp.json
            timeout 180s copilot --disable-builtin-mcps --disable-client-telemetry \
              --additional-mcp-config=@fixture-mcp.json \
              --available-tools=fixture-read_input,fixture-publish_result \
              --allow-tool=fixture --no-ask-user --no-color --silent \
              --prompt "$(cat .github/matched/stats-prompt.md)" > evidence/output.txt 2> evidence/diagnostics.txt
          fi
          node .github/matched/stats-cache.cjs
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: stats-cache
          key: matched-stats-${{ github.run_id }}-${{ matrix.arm }}
      - name: Move the working cache aside
        run: mv stats-cache stats-held
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: stats-cache
          key: matched-stats-${{ github.run_id }}-${{ matrix.arm }}
          fail-on-cache-miss: true
      - name: Verify restored bytes
        run: |
          cmp stats-held/history.json stats-cache/history.json
          cp stats-cache/history.json evidence/restored-state.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stats-${{ matrix.arm }}
          path: evidence/
          retention-days: 14
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        arm: [agent, script]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stats-${{ matrix.arm }}
          path: evidence
      - name: Publish the matched report
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          ARM: ${{ matrix.arm }}
        with:
          retries: 0
          script: |
            const fs = require('node:fs');
            const r = JSON.parse(fs.readFileSync('evidence/result.json','utf8'));
            const title = 'Test detection report ' + context.runId + ' ' + process.env.ARM + ' — ' + r.title;
            const response = await github.rest.issues.create({...context.repo,title,body:r.body,labels:r.labels});
            fs.writeFileSync('publication.json',JSON.stringify({number:response.data.number,url:response.data.html_url}));
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-stats-${{ matrix.arm }}
          path: publication.json
          retention-days: 14
