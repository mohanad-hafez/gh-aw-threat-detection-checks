name: Issue digest
on:
  push:
    branches: [replacement-issue-digest-01]
    paths: [.github/issue-digest-ready]
permissions:
  contents: read
concurrency:
  group: issue-digest
  cancel-in-progress: false
jobs:
  digest:
    if: github.repository == 'mohanad-hafez/gh-aw-threat-detection-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: digest-state
          key: issue-digest-state-v1-${{ github.run_id }}
          restore-keys: issue-digest-state-v1-
      - name: Check labelled issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/issue-digest
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always() && hashFiles('digest-state/reported-issues.json') != ''
        with:
          path: digest-state
          key: issue-digest-state-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-digest
          path: |
            digest-receipt.json
            digest-state/
          retention-days: 7
  verify_state:
    needs: digest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-digest
          path: expected
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: digest-state
          key: issue-digest-state-v1-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Read persisted state back
        run: |
          cmp expected/digest-state/reported-issues.json digest-state/reported-issues.json
          cmp expected/digest-state/attempt.json digest-state/attempt.json
          sha256sum digest-state/*.json > state-readback-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state-readback
          path: state-readback-SHA256SUMS
          retention-days: 7
