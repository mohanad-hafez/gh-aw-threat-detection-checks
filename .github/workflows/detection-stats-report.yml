name: Detection statistics report
on:
  push:
    branches: [replacement-detection-stats-01]
    paths: [.github/detection-stats-ready]
permissions:
  contents: read
concurrency:
  group: detection-statistics-report
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'mohanad-hafez/gh-aw-threat-detection-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Collect daily statistics
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: github/gh-aw
          TARGET_DATE: '2026-11-06'
          FETCH_RESULTS: 'true'
          FETCH_REASONS: 'true'
          MAX_REQUESTS: '750'
          DEADLINE_MINUTES: '12'
          RATE_LIMIT_FLOOR: '100'
          OUTPUT_DIR: /tmp/detection-stats
        run: |
          echo '7205f7e90ec91fb326859b58b73692e553508b15d65cde7d4be656b8ffc4b5d7  scripts/collect-detection-stats.sh' | sha256sum -c -
          bash scripts/collect-detection-stats.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: detection-stats-${{ github.run_id }}
          path: |
            /tmp/detection-stats/stats.json
            /tmp/detection-stats/summary.md
          retention-days: 7
  report:
    needs: collect
    if: always() && github.repository == 'mohanad-hafez/gh-aw-threat-detection-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: detection-stats-${{ github.run_id }}
          path: stats-input
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: stats-history
          key: detection-stats-history-v1-${{ github.run_id }}
          restore-keys: detection-stats-history-v1-
      - name: Publish daily report
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/detection-stats-report
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always() && hashFiles('stats-history/history.json') != ''
        with:
          path: stats-history
          key: detection-stats-history-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: statistics-report
          path: |
            stats-report-receipt.json
            stats-history/history.json
          retention-days: 7
